name: Python and C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up python 3.12
      uses:actions/setup-python@v4
      with:
        python-version: "3,12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run TCP Integration Tests
      run: |
        # Ensure the path is correct from the root of the repo
        pytest p1-waterTank/tests/test_tcp.py

  build-cpp:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Configure CMake
      run: cmake -S p1-waterTank -B p1-waterTank/build

    - name: Build
      run: cmake --build p1-waterTank/build
